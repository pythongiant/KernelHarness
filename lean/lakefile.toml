name = "harness"
version = "0.1.0"
defaultTargets = ["Harness"]

# Byte-level PTX model: core Lean only. Specs are over ByteMap (UInt8), not ℝ, so
# Mathlib is not required. See docs/reference.md (The Lean model) for the optional Mathlib manifest
# (lakefile.mathlib.toml) used when an environment has disk for the cache.
# Generated per-variant modules live in `Harness/Generated/` and are checked
# individually by the verifier (`lake env lean Harness/Generated/<V>.lean`), so they
# are not part of the library glob.
[[lean_lib]]
name = "Harness"
globs = ["Harness", "Harness.PTX.Basic", "Harness.PTX.Instr", "Harness.PTX.Program",
         "Harness.PTX.Event", "Harness.PTX.Thread", "Harness.PTX.Execution",
         "Harness.PTX.Observer", "Harness.PTX.Tcgen05", "Harness.PTX.Cluster",
         "Harness.Lib.Core", "Harness.Tests.BarrierExample",
         "Harness.Tests.ObserverExample", "Harness.Audit", "Harness.Tactic"]
