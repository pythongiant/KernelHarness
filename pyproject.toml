[project]
name = "kernel-harness"
version = "0.1.0"
description = "Closed-loop CUDA kernel discovery: profile, diagnose, optimize, and machine-check each variant against a Lean 4 model of PTX"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Srihari Unnikrishnan" }]
requires-python = ">=3.13"
keywords = ["cuda", "gpu", "kernel-optimization", "lean4", "formal-verification", "ptx", "roofline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Other",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "modal==1.6.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "numpy>=2.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.8"]

[project.scripts]
harness = "harness.cli:main"

[project.urls]
Homepage = "https://github.com/pythongiant/KernelHarness"
Repository = "https://github.com/pythongiant/KernelHarness"
Issues = "https://github.com/pythongiant/KernelHarness/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["lean", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",    # long lines are left to the formatter; SQL/CUDA strings stay unwrapped
    "E731",    # small lambdas in the remote GPU baseline code read better inline
    "E741",    # `l` is the conventional name for a Lean `Launch` in the translator
    "SIM102",
    "SIM105",
]

[tool.ruff.lint.isort]
known-first-party = ["harness"]
